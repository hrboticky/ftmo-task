candles:
  price_basis: bid
  null_price: skip
  late_ticks:
    policy: exclude_after
    lateness_seconds: 1500
  out_of_sequence: same_as_other_ticks
  empty_intervals: omit

services:
  ws_readers: [reader]
  db_writers: [writer]

metrics:
  - stage: ws_received
    url: http://localhost:9101/metrics
  - stage: reader
    url: http://localhost:9101/metrics
  - stage: writer
    url: http://localhost:9102/metrics
