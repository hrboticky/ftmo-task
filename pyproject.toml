[project]
name = "tick-service"
version = "0.0.1"
description = "CandleKeeper homework: tick ingestion and API"
readme = "README.md"
requires-python = ">=3.14,<4"
# Dependencies we expect you to need. Add, remove or change versions as you like.
dependencies = [
    "aiokafka>=0.15,<0.16",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<0.33",
    "fastapi>=0.162.0,<0.163",
    "prometheus-client>=0.26,<0.27",
    "pydantic-settings>=2.14.1,<3",
    # Read by our checks (`make check`, `make verify`); keep it.
    "pyyaml>=6.0.2,<7",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.47,<0.48",
    "uvloop>=0.22.1,<0.24 ; sys_platform == 'linux'",
    "websockets>=15,<18",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0,<3",
    "httpx2>=2,<3",
    "mypy>=2.4,<3",
    "pre-commit>=4.6,<5",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
    "types-pyyaml>=6.0.12,<7",
]

[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = "tests.py test_*.py"
testpaths = ["tests"]

# Keep these checks at least this strict.
[tool.mypy]
local_partial_types = true
explicit_package_bases = true
strict_optional = true
strict_equality = true
strict_equality_for_none = true
strict_bytes = true
strict = true

# Ensure full coverage
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true

# Restrict dynamic typing
disallow_any_generics = true
disallow_subclassing_any = true

# Know exactly what you're doing
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true
warn_return_any = true
show_error_codes = true

# Explicit is better than implicit
no_implicit_optional = true
allow_redefinition = false

plugins = ["pydantic.mypy"]

exclude = "^build/.*"

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["aiokafka.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 129
output-format = "concise"

[tool.ruff.lint]
select = ["ASYNC", "A", "W", "RET", "E", "F", "I", "N", "PL", "PT", "B", "C4", "ARG", "UP", "T20", "TID", "TD", "RSE", "SIM", "RUF", "PYI", "DTZ", "TC", "G", "LOG", "TID252"]
ignore = [
        "PLR2004", # magic-value-comparison
        "PLR0913", # too-many-arguments
        "N818", # error-suffix-on-exception-name
        "ARG001", # unused-function-argument
        "ARG002", # unused-method-argument
        "ARG003", # unused-class-method-argument
        "PLR0912", # too-many-branches
        "TC001", # typing-only-first-party-import
        "TC002", # typing-only-third-party-import
        "TC003", # typing-only-standard-library-import
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
no-lines-before = []
section-order = ["future", "typing", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"typing" = ["typing", "collections.abc"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[tool.setuptools.packages.find]
include = ["app*", "simulator*", "checks*"]
where = ["."]
